<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本史 一問一答ランダム（鎌倉時代）</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#22201c; --sub:#6b665d; --line:#e2ddd2;
    --accent:#b3261e; --accent-soft:#fbeae8; --ok:#2e7d4f; --ok-soft:#e5f3ea; --ng:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1a18; --card:#262422; --ink:#eeeae2; --sub:#a39d92; --line:#3a3733;
      --accent:#ef6b5f; --accent-soft:#3a2523; --ok:#5fc48a; --ok-soft:#1f3328; --ng:#ef6b5f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.6}
  main{max-width:640px;margin:0 auto;padding:16px 14px 48px}
  h1{font-size:1.25rem;margin:4px 0 2px}
  .lead{color:var(--sub);font-size:.85rem;margin:0 0 14px}
  section.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .box h2{font-size:.95rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
  .mini{font-size:.75rem;font-weight:normal}
  .mini button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:2px 8px;margin-left:4px;font-size:.75rem;cursor:pointer}
  label.chk{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer;font-size:.92rem}
  label.chk:first-of-type{border-top:none}
  label.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none}
  label.chk .n{margin-left:auto;color:var(--sub);font-size:.8rem}
  .era{font-size:.75rem;color:var(--sub);margin:6px 0 0}
  .stars{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .stars label.chk{border-top:none}
  .star{color:var(--accent);letter-spacing:1px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:56px;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:.9rem;cursor:pointer}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.88rem}
  .opt input{width:18px;height:18px;accent-color:var(--accent)}
  .big{width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:1.05rem;font-weight:bold;cursor:pointer}
  .big:disabled{opacity:.4;cursor:default}
  .ghost{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:.95rem;cursor:pointer}
  .count{text-align:center;color:var(--sub);font-size:.85rem;margin:8px 0}
  /* quiz */
  .top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--sub);margin-bottom:8px}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;min-height:220px}
  .tag{font-size:.75rem;color:var(--sub)}
  .q{font-size:1.12rem;margin:10px 0 16px;font-weight:600;line-height:2.1}
  .a{display:none;background:var(--accent-soft);border-radius:10px;padding:12px;font-size:1.2rem;font-weight:bold;color:var(--accent)}
  .a.show{display:block}
  .a, ul.miss b{line-height:2.1}
  rt{font-size:.5em;font-weight:normal;opacity:.85}
  .btns{display:flex;gap:10px;margin-top:14px}
  .btns button{flex:1;padding:14px 0;border-radius:10px;font-size:1.05rem;font-weight:bold;cursor:pointer;border:2px solid}
  .b-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)!important}
  .b-ng{background:var(--accent-soft);color:var(--ng);border-color:var(--ng)!important}
  .link{background:none;border:none;color:var(--sub);text-decoration:underline;font-size:.85rem;cursor:pointer;padding:4px}
  .score{font-size:2.2rem;font-weight:bold;text-align:center;margin:6px 0}
  ul.miss{list-style:none;padding:0;margin:0}
  ul.miss li{line-height:2;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
  ul.miss li b{color:var(--accent);display:block}
  .hidden{display:none}
  footer{color:var(--sub);font-size:.72rem;margin-top:20px;text-align:center}
</style>
</head>
<body>
<main>

<!-- 設定画面 -->
<div id="setup">
  <h1>日本史 一問一答ランダム</h1>
  <p class="lead">単元と難易度（★の数）を選んで、ランダムに出題します。</p>

  <section class="box">
    <h2>単元 <span class="mini"><button data-all="unit">全選択</button><button data-none="unit">全解除</button></span></h2>
    <div id="units"></div>
  </section>

  <section class="box">
    <h2>難易度（重要度） <span class="mini"><button data-all="star">全選択</button><button data-none="star">全解除</button></span></h2>
    <div class="stars" id="stars"></div>
  </section>

  <section class="box">
    <h2>出題順</h2>
    <div class="row seg" id="modes">
      <button data-m="random">ランダム</button>
      <button data-m="order">順番（本の順）</button>
    </div>
    <label class="opt" id="fromWrap">対象の <input type="number" id="from" min="1" value="1" style="width:64px;height:auto;padding:4px 6px;font-size:.9rem"> 問目から</label>
  </section>

  <section class="box" id="numBox">
    <h2>出題数</h2>
    <div class="row seg" id="nums"></div>
    <label class="opt"><input type="checkbox" id="onlyMiss"> 前に×をつけた問題だけ</label>
  </section>

  <p class="count" id="count"></p>
  <button class="big" id="start">スタート</button>
</div>

<!-- 出題画面 -->
<div id="quiz" class="hidden">
  <div class="top"><span id="prog"></span><button class="link" id="quit">やめる</button></div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="qcard">
    <div class="tag" id="qtag"></div>
    <div class="q" id="qtext"></div>
    <div class="a" id="atext"></div>
  </div>
  <div id="revealWrap" style="margin-top:14px"><button class="big" id="reveal">答えを見る</button></div>
  <div class="btns hidden" id="judge">
    <button class="b-ng" id="ng">× まちがい</button>
    <button class="b-ok" id="ok">○ 正解</button>
  </div>
</div>

<!-- 結果画面 -->
<div id="result" class="hidden">
  <section class="box">
    <div class="tag" style="text-align:center">結果</div>
    <div class="score" id="score"></div>
    <div class="row" style="flex-direction:column;gap:8px">
      <button class="big" id="retryMiss">×の問題だけもう一度</button>
      <button class="ghost" id="again">同じ条件で新しく出題</button>
      <button class="ghost" id="back">設定にもどる</button>
    </div>
  </section>
  <section class="box" id="missBox">
    <h2>×だった問題</h2>
    <ul class="miss" id="missList"></ul>
  </section>
</div>

<footer>問題文は参考書の内容をもとに独自に作成。単元・★は参考書の区分に準拠。</footer>
</main>

<script src="data.js"></script>
<script>
(function(){
  var U = window.UNITS, Q = window.QUESTIONS;
  var items = Q.map(function(r,i){ return {id:i, u:r[0], s:r[1], q:r[2], a:r[3]}; });
  var STARLAB = {3:"★★★",2:"★★",1:"★",0:"無印"};
  var NUMS = [10,20,30,50,"全部"];
  var store = {
    get:function(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  var saved = store.get("ichimon-settings", {});
  var missSet = store.get("ichimon-miss", {}); // key: q text -> true
  var num = saved.num || 20;
  var mode = saved.mode || "random";
  var $ = function(id){ return document.getElementById(id); };

  // --- 単元チェック ---
  var uHtml = "", lastEra = "";
  U.forEach(function(u){
    if(u.era !== lastEra){ uHtml += '<div class="era">'+u.era+'</div>'; lastEra = u.era; }
    var n = items.filter(function(x){return x.u===u.id;}).length;
    var on = !saved.units || saved.units.indexOf(u.id) >= 0;
    uHtml += '<label class="chk"><input type="checkbox" name="unit" value="'+u.id+'"'+(on?' checked':'')+'>'+
      '<span>'+u.id+'　'+u.name+'</span><span class="n">'+n+'問</span></label>';
  });
  $("units").innerHTML = uHtml;

  // --- 星チェック ---
  var sHtml = "";
  [3,2,1,0].forEach(function(s){
    var n = items.filter(function(x){return x.s===s;}).length;
    var on = !saved.stars || saved.stars.indexOf(s) >= 0;
    sHtml += '<label class="chk"><input type="checkbox" name="star" value="'+s+'"'+(on?' checked':'')+'>'+
      '<span class="'+(s?'star':'')+'">'+STARLAB[s]+'</span><span class="n">'+n+'問</span></label>';
  });
  $("stars").innerHTML = sHtml;

  // --- 出題数 ---
  $("nums").innerHTML = NUMS.map(function(n){
    return '<button data-n="'+n+'"'+(String(n)===String(num)?' class="on"':'')+'>'+(typeof n==="number"?n+"問":n)+'</button>';
  }).join("");
  $("nums").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    num = b.dataset.n === "全部" ? "全部" : +b.dataset.n;
    [].forEach.call(this.children, function(c){ c.classList.toggle("on", c===b); });
    update();
  });

  // --- 出題順 ---
  function paintModes(){
    [].forEach.call($("modes").children, function(c){ c.classList.toggle("on", c.dataset.m===mode); });
    $("fromWrap").classList.toggle("hidden", mode!=="order");
  }
  paintModes();
  $("modes").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    mode = b.dataset.m; paintModes(); update();
  });

  document.querySelectorAll("[data-all],[data-none]").forEach(function(b){
    b.addEventListener("click", function(){
      var name = b.dataset.all || b.dataset.none, val = !!b.dataset.all;
      document.querySelectorAll('input[name="'+name+'"]').forEach(function(c){ c.checked = val; });
      update();
    });
  });
  document.addEventListener("change", function(e){ if(e.target.matches("input")) update(); });

  function checked(name){
    return [].map.call(document.querySelectorAll('input[name="'+name+'"]:checked'), function(c){ return +c.value; });
  }
  function pool(){
    var us = checked("unit"), ss = checked("star"), only = $("onlyMiss").checked;
    return items.filter(function(x){
      return us.indexOf(x.u)>=0 && ss.indexOf(x.s)>=0 && (!only || missSet[x.q]);
    });
  }
  function fromIdx(len){
    var v = parseInt($("from").value, 10);
    if(!(v >= 1)) v = 1;
    return Math.min(v - 1, Math.max(len - 1, 0));
  }
  $("from").addEventListener("input", function(){ update(); });
  function update(){
    var p = pool();
    var rest = mode==="order" ? Math.max(0, p.length - (fromIdx(p.length))) : p.length;
    var k = num==="全部" ? rest : Math.min(num, rest);
    $("count").textContent = "対象 " + p.length + " 問 → " + k + " 問を" + (mode==="order" ? "本の順に" : "ランダムに") + "出題";
    $("start").disabled = p.length === 0;
    store.set("ichimon-settings", {units:checked("unit"), stars:checked("star"), num:num, mode:mode});
  }
  update();

  // --- 出題 ---
  var deck = [], idx = 0, misses = [], lastPool = [];
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function show(id){ ["setup","quiz","result"].forEach(function(s){ $(s).classList.toggle("hidden", s!==id); }); window.scrollTo(0,0); }

  function startWith(list){
    deck = list; idx = 0; misses = [];
    show("quiz"); render();
  }
  $("start").addEventListener("click", function(){
    lastPool = pool();
    var d = mode === "order" ? lastPool.slice(fromIdx(lastPool.length)) : shuffle(lastPool.slice());
    if(num !== "全部") d = d.slice(0, num);
    startWith(d);
  });
  function unitName(id){ for(var i=0;i<U.length;i++) if(U[i].id===id) return U[i].name; return ""; }
  function render(){
    var it = deck[idx];
    $("prog").textContent = (idx+1) + " / " + deck.length;
    $("barfill").style.width = (idx/deck.length*100) + "%";
    $("qtag").innerHTML = it.u + " " + unitName(it.u) + "　<span class='star'>" + (it.s?STARLAB[it.s]:"") + "</span>";
    $("qtext").innerHTML = withYomi(it.q);
    $("atext").innerHTML = withYomi(it.a);
    $("atext").classList.remove("show");
    $("revealWrap").classList.remove("hidden");
    $("judge").classList.add("hidden");
  }
  function reveal(){
    $("atext").classList.add("show");
    $("revealWrap").classList.add("hidden");
    $("judge").classList.remove("hidden");
  }
  $("reveal").addEventListener("click", reveal);
  $("qtext").parentNode.addEventListener("click", function(){ if(!$("atext").classList.contains("show")) reveal(); });

  function judge(ok){
    var it = deck[idx];
    if(ok){ delete missSet[it.q]; } else { missSet[it.q] = true; misses.push(it); }
    store.set("ichimon-miss", missSet);
    idx++;
    if(idx >= deck.length) finish(); else render();
  }
  $("ok").addEventListener("click", function(){ judge(true); });
  $("ng").addEventListener("click", function(){ judge(false); });
  $("quit").addEventListener("click", function(){ if(idx>0){ deck = deck.slice(0, idx); finish(); } else { show("setup"); update(); } });

  function finish(){
    var ok = deck.length - misses.length;
    $("score").textContent = ok + " / " + deck.length;
    $("missBox").classList.toggle("hidden", misses.length===0);
    $("retryMiss").classList.toggle("hidden", misses.length===0);
    $("missList").innerHTML = misses.map(function(m){
      return "<li>" + withYomi(m.q) + "<b>" + esc(m.a) + "</b></li>";
    }).join("");
    show("result");
  }
  function withYomi(a){ return esc(a).replace(/｛([^｜｝]*)｜([^｝]*)｝/g, '<ruby>$1<rt>$2</rt></ruby>'); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  $("retryMiss").addEventListener("click", function(){ startWith(mode==="order" ? misses.slice() : shuffle(misses.slice())); });
  $("again").addEventListener("click", function(){ $("start").click(); });
  $("back").addEventListener("click", function(){ show("setup"); update(); });

  // キーボード操作（PC用）: スペース=答え / ←=× / →=○
  document.addEventListener("keydown", function(e){
    if($("quiz").classList.contains("hidden")) return;
    if(e.key===" " || e.key==="Enter"){ e.preventDefault(); if(!$("atext").classList.contains("show")) reveal(); }
    else if($("atext").classList.contains("show")){
      if(e.key==="ArrowRight") judge(true);
      if(e.key==="ArrowLeft") judge(false);
    }
  });
})();
</script>
</body>
</html>
